[package]
name = "apm-mcp"
version = "1.0.0"
edition = "2024"
authors = ["uongsuadaubung"]
description = "High-performance Rust memory server & plugin for Antigravity (apm-mcp)"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
md-5 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
strsim = "0.11"
unicode-segmentation = "1.13"

[[bin]]
name = "apm-mcp"
path = "src/main.rs"
