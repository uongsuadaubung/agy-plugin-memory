name: Build Cross-Platform Binary (Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows (x64)'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux (x64)'
        required: false
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (ARM64)'
        required: false
        type: boolean
        default: true

jobs:
  build-windows:
    name: Build Windows (x64)
    if: ${{ github.event.inputs.build_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/x86_64-pc-windows-msvc/release/uongsuadaubung-memory.exe" ]; then
            cp target/x86_64-pc-windows-msvc/release/uongsuadaubung-memory.exe dist/uongsuadaubung-memory-windows-x64.exe
          else
            cp target/release/uongsuadaubung-memory.exe dist/uongsuadaubung-memory-windows-x64.exe
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uongsuadaubung-memory-windows-x64.exe
          path: dist/uongsuadaubung-memory-windows-x64.exe

  build-linux:
    name: Build Linux (x64)
    if: ${{ github.event.inputs.build_linux == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/x86_64-unknown-linux-gnu/release/uongsuadaubung-memory" ]; then
            cp target/x86_64-unknown-linux-gnu/release/uongsuadaubung-memory dist/uongsuadaubung-memory-linux-x64
          else
            cp target/release/uongsuadaubung-memory dist/uongsuadaubung-memory-linux-x64
          fi
          chmod +x dist/uongsuadaubung-memory-linux-x64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uongsuadaubung-memory-linux-x64
          path: dist/uongsuadaubung-memory-linux-x64

  build-macos:
    name: Build macOS (ARM64)
    if: ${{ github.event.inputs.build_macos == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/aarch64-apple-darwin/release/uongsuadaubung-memory" ]; then
            cp target/aarch64-apple-darwin/release/uongsuadaubung-memory dist/uongsuadaubung-memory-macos-arm64
          else
            cp target/release/uongsuadaubung-memory dist/uongsuadaubung-memory-macos-arm64
          fi
          chmod +x dist/uongsuadaubung-memory-macos-arm64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uongsuadaubung-memory-macos-arm64
          path: dist/uongsuadaubung-memory-macos-arm64

  publish-release:
    name: Publish Executables to Releases
    needs: [build-windows, build-linux, build-macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Pre-compiled Binaries (uongsuadaubung-memory)"
          body: "Pre-compiled cross-platform binaries built via manual GitHub Actions workflow."
          files: dist-all/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
