name: Build Cross-Platform Binary (Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos

jobs:
  build-windows:
    name: Build Windows (x64)
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/x86_64-pc-windows-msvc/release/uongsuadaubung-memory.exe" ]; then
            cp target/x86_64-pc-windows-msvc/release/uongsuadaubung-memory.exe dist/uongsuadaubung-memory-windows-x64.exe
          else
            cp target/release/uongsuadaubung-memory.exe dist/uongsuadaubung-memory-windows-x64.exe
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uongsuadaubung-memory-windows-x64.exe
          path: dist/uongsuadaubung-memory-windows-x64.exe

  build-linux:
    name: Build Linux (x64)
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/x86_64-unknown-linux-gnu/release/uongsuadaubung-memory" ]; then
            cp target/x86_64-unknown-linux-gnu/release/uongsuadaubung-memory dist/uongsuadaubung-memory-linux-x64
          else
            cp target/release/uongsuadaubung-memory dist/uongsuadaubung-memory-linux-x64
          fi
          chmod +x dist/uongsuadaubung-memory-linux-x64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uongsuadaubung-memory-linux-x64
          path: dist/uongsuadaubung-memory-linux-x64

  build-macos:
    name: Build macOS (ARM64)
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "target/aarch64-apple-darwin/release/uongsuadaubung-memory" ]; then
            cp target/aarch64-apple-darwin/release/uongsuadaubung-memory dist/uongsuadaubung-memory-macos-arm64
          else
            cp target/release/uongsuadaubung-memory dist/uongsuadaubung-memory-macos-arm64
          fi
          chmod +x dist/uongsuadaubung-memory-macos-arm64

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uongsuadaubung-memory-macos-arm64
          path: dist/uongsuadaubung-memory-macos-arm64
